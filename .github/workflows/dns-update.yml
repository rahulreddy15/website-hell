name: DNS Update
run-name: "DNS update: A ${{ inputs.names }} -> ${{ inputs.ip }}"

# Points the domain's Cloudflare A record(s) at a new IPv4 address, for when the
# VM's public IP changes. Never runs automatically and never touches the VM.
# After it succeeds, also update the REMOTE_HOST secret to the same IP.
#
# Auth: if the CLOUDFLARE_EMAIL secret is set, CLOUDFLARE_API_KEY is treated as
# the Global API Key; otherwise it is treated as a scoped API token.
on:
    workflow_dispatch:
        inputs:
            ip:
                description: New IPv4 address for the A record(s)
                required: true
                type: string
            names:
                description: Space-separated A record names to update
                required: true
                type: string
                default: rahulreddy.in

permissions:
    contents: read

concurrency:
    group: dns-update
    cancel-in-progress: false

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - name: Update A records
              env:
                CF_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
                CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
                ZONE_NAME: rahulreddy.in
                NEW_IP: ${{ inputs.ip }}
                RECORD_NAMES: ${{ inputs.names }}
              run: |
                set -euo pipefail

                if [ -z "${CF_KEY:-}" ]; then
                  echo "::error::Repository secret CLOUDFLARE_API_KEY is not set."
                  exit 1
                fi

                # Reject anything that is not a plain dotted-quad IPv4 address.
                if ! [[ "$NEW_IP" =~ ^([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})$ ]]; then
                  echo "::error::'$NEW_IP' is not an IPv4 address."
                  exit 1
                fi
                for octet in "${BASH_REMATCH[@]:1}"; do
                  if [ "$octet" -gt 255 ]; then
                    echo "::error::'$NEW_IP' is not an IPv4 address."
                    exit 1
                  fi
                done

                if [ -n "${CF_EMAIL:-}" ]; then
                  auth=(-H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_KEY")
                else
                  auth=(-H "Authorization: Bearer $CF_KEY")
                fi

                # Callers capture stdout, so errors go to stderr to stay visible in the log.
                cf() {
                  local method=$1 path=$2; shift 2
                  local body
                  body=$(curl -sS -X "$method" "https://api.cloudflare.com/client/v4$path" \
                    "${auth[@]}" -H "Content-Type: application/json" "$@")
                  if [ "$(jq -r '.success' <<<"$body" 2>/dev/null)" != "true" ]; then
                    echo "::error::Cloudflare API $method $path failed: $(jq -c '.errors' <<<"$body" 2>/dev/null || echo "$body")" >&2
                    exit 1
                  fi
                  printf '%s' "$body"
                }

                zone_id=$(cf GET "/zones?name=$ZONE_NAME" | jq -r '.result[0].id // empty')
                if [ -z "$zone_id" ]; then
                  echo "::error::Zone $ZONE_NAME not found for these credentials."
                  exit 1
                fi

                echo "Current A records in $ZONE_NAME:"
                cf GET "/zones/$zone_id/dns_records?type=A&per_page=100" \
                  | jq -r '.result[] | "  \(.name) -> \(.content) (proxied: \(.proxied))"'

                for name in $RECORD_NAMES; do
                  records=$(cf GET "/zones/$zone_id/dns_records?type=A&name=$name")
                  count=$(jq '.result | length' <<<"$records")
                  if [ "$count" -ne 1 ]; then
                    echo "::error::Expected exactly one A record named $name, found $count. Not changing anything for it."
                    exit 1
                  fi
                  record_id=$(jq -r '.result[0].id' <<<"$records")
                  old_ip=$(jq -r '.result[0].content' <<<"$records")

                  if [ "$old_ip" = "$NEW_IP" ]; then
                    echo "$name already points to $NEW_IP; nothing to do."
                    continue
                  fi

                  # PATCH only the address, so TTL and proxy status are preserved.
                  updated=$(cf PATCH "/zones/$zone_id/dns_records/$record_id" \
                    --data "$(jq -n --arg ip "$NEW_IP" '{content: $ip}')" | jq -r '.result.content')
                  if [ "$updated" != "$NEW_IP" ]; then
                    echo "::error::$name reads back as $updated after the update, expected $NEW_IP."
                    exit 1
                  fi
                  echo "$name: $old_ip -> $NEW_IP"
                done

                echo "Done. Remember to set the REMOTE_HOST secret to $NEW_IP so deploys reach the VM."
