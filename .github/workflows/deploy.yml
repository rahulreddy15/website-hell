name: Deploy to Server
run-name: >-
    ${{ github.event_name == 'pull_request'
        && format('Build check for PR #{0} 🔍', github.event.pull_request.number)
        || format('Deployment Action Triggered ({0}) 🚀', github.run_id) }}
on:
    workflow_dispatch:
    push:
        branches:
            - main
    # Pull requests build and validate only; the deploy steps below are
    # gated so a PR never touches the production VM.
    pull_request:
        branches:
            - main

# Add explicit permissions for the workflow
permissions:
    contents: read

jobs:
    explore-actions:
        runs-on: ubuntu-latest
        steps:
            - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
            - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
            - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

            - name: Check out repository code
              uses: actions/checkout@v4

            - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."

            # Pinned deliberately. The templates use Tera v2 syntax, which
            # requires Zola >= 0.22. 'snap install zola --edge' served an
            # older Tera v1 build and failed to parse them, so do not
            # replace this with an unpinned install.
            - name: Install Zola
              uses: taiki-e/install-action@v2
              with:
                tool: zola@0.23.2

            - name: Build Zola Application
              run: |
                zola --version
                zola --root blog build
                echo "Files in build directory"
                ls ${{ github.workspace }}/blog/public

            - name: Check Zola Site
              run: |
                # Skip external links: third-party sites cause flaky CI failures.
                # Run 'zola --root blog check' locally to validate them.
                zola --root blog check --skip-external-links

            - name: Validate Food Planner
              run: |
                python3 -m py_compile food-planner/app.py food-planner/smoke_test.py
                python3 food-planner/smoke_test.py
                bash -n food-planner/deploy/install.sh
                bash -n food-planner/deploy/check-vm-prereqs.sh

            # Validation runs on every trigger, including pull requests. The VM deploy
            # for this app lives in the gated 'Deploy to Server' step below.
            - name: Validate Symptom Tracker
              run: |
                python3 -m py_compile symptom-tracker/app.py symptom-tracker/db.py symptom-tracker/smoke_test.py symptom-tracker/deploy/db-status.py symptom-tracker/deploy/backup.py
                python3 symptom-tracker/smoke_test.py
                bash -n symptom-tracker/deploy/install.sh
                bash -n symptom-tracker/deploy/install-caddy-route.sh
                bash -n symptom-tracker/deploy/restic-backup.sh
                bash -n symptom-tracker/deploy/migrate-local-db.sh

            - name: Setup SSH
              if: github.event_name != 'pull_request'
              run: |
                # Install sshpass for password authentication
                sudo apt-get update
                sudo apt-get install -y sshpass

                # Create SSH directory and set proper permissions
                mkdir -p ~/.ssh
                chmod 700 ~/.ssh

                # Add remote host to known_hosts to avoid host key verification
                ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

            - name: Deploy to Server
              if: github.event_name != 'pull_request'
              env:
                REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
                REMOTE_USER: ${{ secrets.REMOTE_USER }}
                REMOTE_PASS: ${{ secrets.REMOTE_PASS }}
              run: |
                echo "Deploying to server..."

                # Prepare temporary upload directories before scp.
                sshpass -p "$REMOTE_PASS" ssh -o StrictHostKeyChecking=no "$REMOTE_USER@$REMOTE_HOST" \
                  "rm -rf /tmp/deploy_temp /tmp/food_planner_release && mkdir -p /tmp/deploy_temp /tmp/food_planner_release"

                # Clear existing files on server (with sudo if needed)
                sshpass -p "$REMOTE_PASS" ssh -o StrictHostKeyChecking=no "$REMOTE_USER@$REMOTE_HOST" \
                  "sudo mkdir -p /var/www/html && sudo rm -rf /var/www/html/* || rm -rf /var/www/html/*"

                # Copy Zola site to server
                sshpass -p "$REMOTE_PASS" scp -r -o StrictHostKeyChecking=no \
                  ${{ github.workspace }}/blog/public/* "$REMOTE_USER@$REMOTE_HOST:/tmp/deploy_temp/"

                # Move files from temp to final destination with proper permissions
                sshpass -p "$REMOTE_PASS" ssh -o StrictHostKeyChecking=no "$REMOTE_USER@$REMOTE_HOST" \
                  "sudo mv /tmp/deploy_temp/* /var/www/html/ && sudo chown -R root:root /var/www/html/ && sudo chmod -R 755 /var/www/html/"

                # Deploy Food Planner app and backend service.
                echo "Deploying Food Planner app..."
                sshpass -p "$REMOTE_PASS" scp -r -o StrictHostKeyChecking=no \
                  ${{ github.workspace }}/food-planner/* "$REMOTE_USER@$REMOTE_HOST:/tmp/food_planner_release/"

                sshpass -p "$REMOTE_PASS" ssh -o StrictHostKeyChecking=no "$REMOTE_USER@$REMOTE_HOST" \
                  "cd /tmp/food_planner_release && sudo bash deploy/install.sh"

                sshpass -p "$REMOTE_PASS" ssh -o StrictHostKeyChecking=no "$REMOTE_USER@$REMOTE_HOST" \
                  "curl -fsS http://127.0.0.1:8010/api/bootstrap >/dev/null && curl -fsS https://rahulreddy.in/food-planner/api/bootstrap >/dev/null"

                # Deploy Symptom Tracker. Health data: install.sh takes a versioned
                # pre-migration snapshot before restarting, and never touches
                # /var/lib/symptom-tracker. The public /tracker/ route requires the Caddy
                # snippet to be installed once by hand, so only loopback is checked here.
                echo "Deploying Symptom Tracker app..."
                sshpass -p "$REMOTE_PASS" ssh -o StrictHostKeyChecking=no "$REMOTE_USER@$REMOTE_HOST" \
                  "rm -rf /tmp/symptom_tracker_release && mkdir -p /tmp/symptom_tracker_release"

                sshpass -p "$REMOTE_PASS" scp -r -o StrictHostKeyChecking=no \
                  ${{ github.workspace }}/symptom-tracker/* "$REMOTE_USER@$REMOTE_HOST:/tmp/symptom_tracker_release/"

                sshpass -p "$REMOTE_PASS" ssh -o StrictHostKeyChecking=no "$REMOTE_USER@$REMOTE_HOST" \
                  "cd /tmp/symptom_tracker_release && sudo bash deploy/install.sh"

                sshpass -p "$REMOTE_PASS" ssh -o StrictHostKeyChecking=no "$REMOTE_USER@$REMOTE_HOST" \
                  "curl -fsS http://127.0.0.1:8011/tracker/api/auth/session >/dev/null"

            - name: Job Status
              run: echo "🍏 This job's status is ${{ job.status }}."
