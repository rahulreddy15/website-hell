title = "Rahul Annareddy"
base_url = "https://rahulreddy.in"
description = "Writing about stuff ..."
generate_feeds = false
feed_filenames = ["atom.xml"]

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# Agent guides live alongside content but are not pages
ignored_content = ["**/AGENTS.md"]

taxonomies = [
  { name = "categories", feed = true },
  { name = "tags", feed = true },
]

default_language = "en"

# NOTE: every bare key above must stay above the first table header below,
# otherwise TOML absorbs it into that table.

[link_checker]
# LinkedIn returns HTTP 999 to non-browser clients; not a real broken link
skip_prefixes = ["https://linkedin.com/", "https://www.linkedin.com/"]

[translations]
no_posts = "No posts yet"
remove_filter = "Remove filter"
filtering_for = "Filtering for"
made_with = "Made with"
table_of_contents = "Table of contents"
language = "language"
site = "site"

[markdown]
render_emoji = true
smart_punctuation = true

# Syntax highlighting configuration
# Theme can be customised by setting `theme` to any theme supported by Zola
[markdown.highlighting]
theme = "github-dark"

[extra]
date_format="%d %b, %Y"
webserver_sends_csp_headers = true
language_switcher = false

[extra.table_of_contents]
show = true
max_level = 2
visible_on_load = true

[[extra.main_menu]]
name = "Blog"
url = "@/blog/_index.md"

